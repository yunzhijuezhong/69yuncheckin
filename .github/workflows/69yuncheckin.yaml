name: Python CI 2

on:
  schedule:
    - cron: '1 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      USER1: ${{ secrets.USER1 }}
      PASS1: ${{ secrets.PASS1 }}
      USER2: ${{ secrets.USER2 }}
      PASS2: ${{ secrets.PASS2 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python script
        run: python 69yun.py
